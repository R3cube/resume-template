name: Generate PDF

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  pdf:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v4

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Wait for Pages to propagate
        run: sleep 20

      - name: Build filename from config
        id: meta
        run: |
          echo "site_url=$SITE" >> $GITHUB_OUTPUT

          if [ ! -f "_config.yml" ]; then
            echo "Missing _config.yml"; exit 1
          fi
          RESUME_NAME=$(grep -E '^resume_name:' "_config.yml" | cut -d':' -f2- | xargs)

          SAFE_NAME=$(printf "%s" "$RESUME_NAME" \
            | iconv -t ascii//TRANSLIT 2>/dev/null || printf "%s" "$RESUME_NAME")
          SAFE_NAME=$(printf "%s" "$SAFE_NAME" \
            | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="resume"
          FILE="pdfs/${SAFE_NAME}.pdf"

          mkdir -p pdfs
          echo "file_path=$FILE" >> $GITHUB_OUTPUT
          echo "pdf_name=${SAFE_NAME}.pdf" >> $GITHUB_OUTPUT

      - name: Render PDF
        run: |
          wkhtmltopdf --viewport-size 2000x2000 --orientation Portrait --page-size A4 \
            --margin-bottom 0 --margin-left 0 --margin-right 0 --margin-top 0 \
            --javascript-delay 2000 \
            "${{ steps.meta.outputs.site_url }}" "${{ steps.meta.outputs.file_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.pdf_name }}
          path: ${{ steps.meta.outputs.file_path }}

      # ---------- Google Drive Upload ----------
