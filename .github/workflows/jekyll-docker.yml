name: Jekyll site CI + PDF (multi-job, install first)

on:
  push:
    branches: ["employee/**"]
  pull_request:
    branches: ["employee/**"]

jobs:
  install:
    name: Install & Validate Environment
    runs-on: ubuntu-latest
    outputs:
      file_name: ${{ steps.meta.outputs.file_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate resume_name and compute file name
        id: meta
        run: |
          set -euo pipefail
          if ! grep -q '^resume_name:' _config.yml; then
            echo "❌ 'resume_name:' not found"; exit 1
          fi
          RAW=$(grep '^resume_name:' _config.yml | sed 's/resume_name:[ ]*//' | tr -d '\r"')
          if [ -z "$RAW" ]; then echo "❌ resume_name is empty"; exit 1; fi
          SLUG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g;s/_\+/_/g;s/^_//;s/_$//')
          if [ -z "$SLUG" ]; then echo "❌ Invalid slug generation"; exit 1; fi
          echo "file_name=${SLUG}.pdf" >> "$GITHUB_OUTPUT"
          echo "✅ File name set: ${SLUG}.pdf"

      - name: Install wkhtmltopdf (patched Qt)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget xfonts-75dpi fontconfig libxrender1
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt install -y ./wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          wkhtmltopdf --version || { echo "❌ wkhtmltopdf failed"; exit 1; }
          echo "✅ wkhtmltopdf installed"

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version || { echo "❌ rclone failed"; exit 1; }
          echo "✅ rclone installed"

  build:
    name: Build Site
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Build Jekyll via Docker
        run: |
          set -euo pipefail
          docker run --rm \
            -e JEKYLL_UID=$(id -u) -e JEKYLL_GID=$(id -g) \
            -v "$PWD":/srv/jekyll -v "$PWD/vendor/bundle":/usr/local/bundle \
            jekyll/jekyll:4 \
            sh -lc "bundle install && bundle exec jekyll build --trace"
          test -f _site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site

  generate:
    name: Generate PDF
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: _site
          path: _site

      - name: Generate PDF using wkhtmltopdf
        run: |
          set -euo pipefail
          PDF="${{ needs.install.outputs.file_name }}"
          wkhtmltopdf --enable-local-file-access \
            --orientation Portrait --page-size A4 \
            --margin-bottom 0 --margin-top 0 --margin-left 0 --margin-right 0 \
            --javascript-delay 2000 \
            "file://$PWD/_site/index.html" "$PDF"
          ls -l "$PDF"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.install.outputs.file_name }}
          path: ${{ needs.install.outputs.file_name }}

  upload:
    name: Upload to Google Drive
    runs-on: ubuntu-latest
    needs: generate
    if: ${{ secrets.GDRIVE_SA_JSON && secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.install.outputs.file_name }}
          path: .

      - run: |
          set -euo pipefail
          echo '${{ secrets.GDRIVE_SA_JSON }}' > sa.json
          rclone config create gdrive drive \
            scope=drive \
            service_account_file=sa.json \
            root_folder_id='${{ secrets.GDRIVE_FOLDER_ID }}' \
            --non-interactive
          rclone copy "${{ needs.install.outputs.file_name }}" gdrive: --progress