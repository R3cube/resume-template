name: Jekyll site CI + PDF

on:
  push:
    branches: [ "employee/**" ]
  pull_request:
    branches: [ "employee/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wkhtmltopdf and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf curl python3

      - name: Build filename from config
        id: meta
        run: |
          if [ ! -f "_config.yml" ]; then
            echo "Missing _config.yml"; exit 1
          fi
          RESUME_NAME=$(grep -E '^resume_name:' "_config.yml" | cut -d':' -f2- | xargs)

          SAFE_NAME=$(printf "%s" "$RESUME_NAME" \
            | iconv -t ascii//TRANSLIT 2>/dev/null || printf "%s" "$RESUME_NAME")
          SAFE_NAME=$(printf "%s" "$SAFE_NAME" \
            | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="resume"
          FILE="pdfs/${SAFE_NAME}.pdf"

          mkdir -p pdfs
          echo "file_path=$FILE" >> $GITHUB_OUTPUT
          echo "pdf_name=${SAFE_NAME}.pdf" >> $GITHUB_OUTPUT

      - name: Build & Serve Jekyll site in container
        run: |
          docker run -d --name jekyll-server -p 8080:4000 \
            -v ${{ github.workspace }}:/srv/jekyll \
            jekyll/builder:latest /bin/bash -c \
              "chmod -R 777 /srv/jekyll && jekyll serve --host 0.0.0.0 --port 4000 --future"

          # Wait until server responds
          for i in {1..15}; do
            if curl -s -o /dev/null http://localhost:8080; then
              echo "Jekyll server is live"
              break
            fi
            echo "Waiting for Jekyll server..."
            sleep 2
          done

      - name: Render PDF from localhost
        run: |
          wkhtmltopdf \
            --viewport-size 2000x2000 --orientation Portrait --page-size A4 \
            --margin-bottom 0 --margin-left 0 --margin-right 0 --margin-top 0 \
            --javascript-delay 2000 --enable-local-file-access \
            "http://localhost:8080/index.html" \
            "${{ steps.meta.outputs.file_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.pdf_name }}
          path: ${{ steps.meta.outputs.file_path }}

