name: Jekyll site CI + PDF (single job)

on:
  push:
    branches: ["employee/**"]
  pull_request:
    branches: ["employee/**"]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # ------------------ CHECKOUT ------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------ FAIL EARLY: nome PDF ------------------
      - name: Validate resume_name and compute file name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^resume_name:' _config.yml; then
            echo "❌ 'resume_name:' non trovato in _config.yml"; exit 1
          fi
          RAW_NAME=$(grep '^resume_name:' _config.yml | sed 's/resume_name:[ ]*//' | tr -d '\r"')
          if [ -z "${RAW_NAME}" ]; then
            echo "❌ 'resume_name:' vuoto in _config.yml"; exit 1
          fi
          SLUG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/_/g;s/_\+/_/g;s/^_//;s/_$//')
          if [ -z "${SLUG_NAME}" ]; then
            echo "❌ Impossibile calcolare lo slug dal nome"; exit 1
          fi
          echo "file_name=${SLUG_NAME}.pdf" >> "$GITHUB_OUTPUT"
          echo "✅ PDF verrà salvato come: ${SLUG_NAME}.pdf"

      # ------------------ INSTALL (in cima) ------------------
      - name: Install wkhtmltopdf (patched Qt) & verify
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget xfonts-75dpi fontconfig libxrender1
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt install -y ./wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          wkhtmltopdf --version || { echo "❌ wkhtmltopdf non funzionante"; exit 1; }
          echo "✅ wkhtmltopdf OK"

      - name: Install rclone & verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version || { echo "❌ rclone non funzionante"; exit 1; }
          echo "✅ rclone OK"

      # ------------------ BUILD (Docker) ------------------
      - name: Build site in Docker (no server)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e JEKYLL_UID=$(id -u) -e JEKYLL_GID=$(id -g) \
            -v "$PWD":/srv/jekyll \
            -v "$PWD/vendor/bundle":/usr/local/bundle \
            jekyll/jekyll:4 \
            sh -lc "bundle install && bundle exec jekyll build --trace"
          test -f _site/index.html || (echo "❌ _site/index.html non trovato" && exit 1)

      # ------------------ GENERATE PDF ------------------
      - name: Generate PDF from local _site
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.meta.outputs.file_name }}"
          [ -n "$FILE" ] || { echo "❌ Nome PDF mancante (output meta)"; exit 1; }
          wkhtmltopdf --enable-local-file-access \
            --orientation Portrait --page-size A4 \
            --margin-bottom 0 --margin-left 0 --margin-right 0 --margin-top 0 \
            --javascript-delay 2000 \
            "file://$GITHUB_WORKSPACE/_site/index.html" "$FILE"
          ls -l "$FILE"

      # ------------------ ARTIFACT ------------------
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.file_name }}
          path: ${{ steps.meta.outputs.file_name }}

      # ------------------ (OPZIONALE) DRIVE UPLOAD ------------------
      # Usa env per poter fare if: (secrets.* non è disponibile nell'if)
      - name: Configure rclone (Service Account pinned to folder)
        if: env.GDRIVE_SA_JSON != '' && env.GDRIVE_FOLDER_ID != ''
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}  # <— NEW
        run: |
          set -euo pipefail
          echo "$GDRIVE_SA_JSON" > sa.json
          rclone config delete gdrive || true
          rclone config create gdrive drive \
            scope=drive \
            service_account_file=sa.json \
            root_folder_id="$GDRIVE_FOLDER_ID" \
            --non-interactive
          # point to the Shared Drive (required in many cases)
          rclone config update gdrive team_drive "$GDRIVE_SHARED_DRIVE_ID" --non-interactive

          # fast check (fail early if not accessible)
          rclone lsd gdrive:/ || { echo "❌ SA non vede la cartella (condividi/membership/ID)"; exit 1; }

      - name: Upload PDF to Google Drive
        if: env.GDRIVE_SA_JSON != '' && env.GDRIVE_FOLDER_ID != ''
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          rclone copy "${{ steps.meta.outputs.file_name }}" gdrive: --progress
