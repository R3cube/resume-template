name: Jekyll site CI + PDF (multi-job)

on:
  push:
    branches: ["employee/**"]
  pull_request:
    branches: ["employee/**"]

jobs:
  # 1) VALIDATE (fail early, compute outputs)
  validate:
    runs-on: ubuntu-latest
    outputs:
      file_name: ${{ steps.meta.outputs.file_name }}
      has_drive: ${{ steps.drive.outputs.has_drive }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate resume_name and compute file name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^resume_name:' _config.yml; then
            echo "❌ 'resume_name:' non trovato in _config.yml"; exit 1
          fi
          RAW_NAME=$(grep '^resume_name:' _config.yml | sed 's/resume_name:[ ]*//' | tr -d '\r"')
          if [ -z "${RAW_NAME}" ]; then
            echo "❌ 'resume_name:' vuoto in _config.yml"; exit 1
          fi
          SLUG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/_/g;s/_\+/_/g;s/^_//;s/_$//')
          [ -n "$SLUG_NAME" ] || { echo "❌ Impossibile calcolare lo slug"; exit 1; }
          echo "file_name=${SLUG_NAME}.pdf" >> "$GITHUB_OUTPUT"
          echo "✅ PDF: ${SLUG_NAME}.pdf"

      - name: Decide if Drive upload should run
        id: drive
        shell: bash
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${GDRIVE_SA_JSON}" ] && [ -n "${GDRIVE_FOLDER_ID}" ] && [ -n "${GDRIVE_SHARED_DRIVE_ID}" ]; then
            echo "has_drive=true" >> "$GITHUB_OUTPUT"
            echo "✅ Drive secrets presenti"
          else
            echo "has_drive=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Drive upload disabilitato (manca uno dei secret)"
          fi

  # 2) BUILD (Jekyll → _site)
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site in Docker (no server)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e JEKYLL_UID=$(id -u) -e JEKYLL_GID=$(id -g) \
            -v "$PWD":/srv/jekyll \
            -v "$PWD/vendor/bundle":/usr/local/bundle \
            jekyll/jekyll:4 \
            sh -lc "bundle install && bundle exec jekyll build --trace"
          test -f _site/index.html || (echo "❌ _site/index.html non trovato" && exit 1)

      - name: Upload _site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
        # Artifact v4 recommended. :contentReference[oaicite:1]{index=1}

  # 3) GENERATE (wkhtmltopdf → PDF)
  generate:
    runs-on: ubuntu-latest
    needs: [validate, build]
    outputs:
      file_name: ${{ needs.validate.outputs.file_name }}
    steps:
      - name: Install wkhtmltopdf (patched Qt) & verify
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget xfonts-75dpi fontconfig libxrender1
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt install -y ./wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          wkhtmltopdf --version
        # Official packaging release for 0.12.6.1-2 (Jammy). :contentReference[oaicite:2]{index=2}

      - name: Download _site
        uses: actions/download-artifact@v4
        with:
          name: _site
          path: _site

      - name: Generate PDF from local _site
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ needs.validate.outputs.file_name }}"
          [ -n "$FILE" ] || { echo "❌ Nome PDF mancante"; exit 1; }
          wkhtmltopdf --enable-local-file-access \
            --orientation Portrait --page-size A4 \
            --margin-bottom 0 --margin-left 0 --margin-right 0 --margin-top 0 \
            --javascript-delay 2000 \
            "file://$GITHUB_WORKSPACE/_site/index.html" "$FILE"
          ls -l "$FILE"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.file_name }}
          path: ${{ needs.validate.outputs.file_name }}

  # 4) UPLOAD (optional: rclone → Google Drive)
  upload:
    runs-on: ubuntu-latest
    needs: [validate, generate]
    if: ${{ needs.validate.outputs.has_drive == 'true' }}  # gate by output, not secrets context
    steps:
      - name: Install rclone & verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
        # rclone install docs. :contentReference[oaicite:3]{index=3}

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.file_name }}
          path: .

      - name: Configure rclone (pin to folder + shared drive) and health check
        shell: bash
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          set -euo pipefail
          echo "$GDRIVE_SA_JSON" > sa.json
          # fresh remote to avoid stale config
          rclone config delete gdrive || true
          rclone config create gdrive drive \
            scope=drive \
            service_account_file=sa.json \
            root_folder_id="$GDRIVE_FOLDER_ID" \
            --non-interactive
          # Shared Drive must be specified for Team Drives
          rclone config update gdrive team_drive "$GDRIVE_SHARED_DRIVE_ID" --non-interactive
          echo "== rclone lsd gdrive:/ (should not 404) =="
          rclone lsd gdrive:/  # fail early if folder/drive not visible
        # rclone Drive + Team Drive config. :contentReference[oaicite:4]{index=4}

      - name: Upload PDF to Google Drive
        shell: bash
        run: |
          set -euo pipefail
          rclone copy "${{ needs.validate.outputs.file_name }}" gdrive: --progress