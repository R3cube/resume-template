name: Jekyll site CI + PDF (Docker serve)

on:
  push:
    branches: ["employee/**"]
  pull_request:
    branches: ["employee/**"]

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read site name from _config.yml
        id: meta
        run: |
          RAW_NAME=$(grep '^resume_name:' _config.yml | sed 's/resume_name:[ ]*//' | tr -d '\r"')
          [ -z "$RAW_NAME" ] && RAW_NAME="site"
          SLUG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g;s/_\+/_/g;s/^_//;s/_$//')
          echo "file_name=${SLUG_NAME}.pdf" >> $GITHUB_OUTPUT

      # Start Jekyll inside the official Docker image and serve on port 4000
      - name: Serve site via jekyll/jekyll
        run: |
          docker run -d --name jekyll \
            -p 4000:4000 \
            -v "$PWD":/srv/jekyll \
            jekyll/jekyll:4 \
            sh -lc "bundle install && jekyll serve --host 0.0.0.0 --port 4000 --safe --trace"
          # wait until the server responds
          for i in {1..60}; do
            curl -sSf http://127.0.0.1:4000/ >/dev/null && break
            sleep 2
          done

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Generate PDF from localhost
        run: |
          SITE_URL="http://127.0.0.1:4000/?cache=$(date +%s)"
          echo "Fetching from: $SITE_URL"
          wkhtmltopdf \
            --enable-local-file-access \
            --viewport-size 2000x2000 \
            --orientation Portrait \
            --page-size A4 \
            --margin-bottom 0 --margin-left 0 --margin-right 0 --margin-top 0 \
            --javascript-delay 2000 \
            "$SITE_URL" "${{ steps.meta.outputs.file_name }}"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.file_name }}
          path: ${{ steps.meta.outputs.file_name }}

      - name: Stop container
        if: always()
        run: docker rm -f jekyll || true

