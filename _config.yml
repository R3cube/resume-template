# Site settings
title: "Jekyll Resume Template"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Paolo Latella"
resume_title:                   "Co-Founder at Recube, Cloud Advisor, AWS Authorized Instructor Champion, AWS Hero"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "ing.paolo.latella@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Rome, Latium, Italy"

resume_header_contact_info:     "ing.paolo.latella@gmail.com • Rome, Latium, Italy • www.linkedin.com/in/paololatella • www.recube.it"
display_header_contact_info:    "true"

resume_header_intro: "<p>Computer engineer with over 20 years of experience in IT and more than 10 years on AWS technologies. I lead enterprise customers through a variety of transformative projects involving IT strategy, distributed architecture, and AWS cloud technologies. As an AWS Authorized Instructor and AWS Hero, I am passionate about advocating and teaching others about a wide range of cloud services and technologies, and am a prominent leader in the Italian AWS community.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        false
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           true
resume_section_associations:    false
resume_section_interests:       false

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            ""
  resume_twitter_url:           ""
  resume_dribbble_url:          ""
  resume_facebook_url:          ""
  resume_linkedin_url:          "https://www.linkedin.com/in/paololatella"
  resume_instagram_url:         ""
  resume_website_url:           "https://www.recube.it"
  resume_medium_url:            ""
resume_print_social_links:      false

# Design settings
resume_theme:                   default
# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts