# Site settings
title: "Francesco Gallo — Resume"
description: "Cloud AI Engineer crafting secure, serverless GenAI/RAG solutions on AWS."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Francesco Gallo"
resume_title:                   "Cloud AI Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           ""

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Italia"

resume_header_contact_info:     "Think AI. Build Serverless."
display_header_contact_info:    "true"

resume_header_intro: "<p>Recent Computer Science graduate with a strong interest in Software Engineering, Machine Learning, and Cloud Computing. Proactive problem-solver with a collaborative mindset and commitment to continuous learning. Currently a Cloud AI Engineer at R3cube, focusing on serverless architectures and GenAI/RAG solutions.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           true
resume_section_associations:    true
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            ""
  resume_twitter_url:           ""
  resume_dribbble_url:          ""
  resume_facebook_url:          ""
  resume_linkedin_url:          ""
  resume_instagram_url:         ""
  resume_website_url:           ""
  resume_medium_url:            ""
resume_print_social_links:      false

# Design settings
resume_theme:                   default
