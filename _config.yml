title: "Gabriele Pipitò — Resume"
description: "Cloud Engineer focused on AWS, networking, and hands-on problem solving."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Gabriele Pipitò"
resume_title:                   "Cloud Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           ""

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Italy"

resume_header_contact_info:     "Building on AWS with curiosity and rigor"
display_header_contact_info:    "true"

resume_header_intro: "<p>Cloud engineer passionate about AWS, networking, and automation. I started from hardware and troubleshooting, then moved into cloud fundamentals and hands-on labs. I enjoy learning by building: setting up VPCs, securing workloads, and deploying services with the CLI and console. I’m focused on practical problem solving, clear communication, and steady improvement through structured study and real projects.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           false
resume_section_associations:    true
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            ""
  resume_twitter_url:           ""
  resume_dribbble_url:          ""
  resume_facebook_url:          ""
  resume_linkedin_url:          ""
  resume_instagram_url:         ""
  resume_website_url:           ""
  resume_medium_url:            ""
resume_print_social_links:      false

# Design settings
resume_theme:                   default
# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts