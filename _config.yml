title: "Gianluigi Mucciolo — Resume"
description: "Cloud Innovation Lead, AWS Authorized Instructor, & Data/AI Architect."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Gianluigi Mucciolo"
resume_title:                   "Cloud Innovation Lead & AWS Authorized Instructor"

# used for the contact button in _layouts/resume.html
resume_contact_email:           ""

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Italy"

resume_header_contact_info:     "Inspiring Teams with Purpose and Vision"
display_header_contact_info:    "true"

resume_header_intro: "<p>Cloud architect and educator specializing in AWS, data engineering, and applied AI. I design secure, scalable platforms, lead hands-on training as an AWS Authorized Instructor, and build real-time analytics and ML solutions that turn business goals into measurable outcomes. Over the years, I have dedicated my work to designing efficient and secure cloud architectures, applying DevOps methodologies, and pursuing my passion for Artificial Intelligence and Big Data. As an AWS Authorized Instructor, I mentor the next generation of cloud professionals, helping them master the design of advanced infrastructures. I am continually seeking innovative ideas and investing in my personal and professional growth, often drawing inspiration from quiet environments and nature where I can reflect, read, and recharge.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           false
resume_section_associations:    true
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            ""
  resume_twitter_url:           ""
  resume_dribbble_url:          ""
  resume_facebook_url:          ""
  resume_linkedin_url:          ""
  resume_instagram_url:         ""
  resume_website_url:           ""
  resume_medium_url:            ""
resume_print_social_links:      false

# Design settings
resume_theme:                   default
