# Site settings
title: "Mario Gabriele Ossanna — Resume"
description: "Cloud Architect & AWS Authorized Instructor, AWS serverless, and IaC." 

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

resume_avatar:                  "true"
resume_name:                    "Mario Gabriele Ossanna"
resume_title:                   "Cloud Architect & AWS Authorized Instructor"   # current employee role at Recube

# used for the contact button in _layouts/resume.html
resume_contact_email:           ""

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Italy"

# short motto aligned to mission (Cloud/DevOps, reliability)
resume_header_contact_info:     "Automate. Secure. Deliver."
display_header_contact_info:    "true"

# executive summary (condensed from the PRESENTAZIONE section)
resume_header_intro: "<p>Cloud Architect and AWS Authorized Instructor with a strong background in designing secure, scalable, and resilient cloud infrastructures. Specialized in AWS, Infrastructure as Code, cloud security, automation, DevOps practices, and architectural governance. Experienced in leading technical teams, supporting complex cloud transformations, and translating business requirements into reliable and efficient solutions. Passionate about knowledge sharing, continuous improvement, and helping teams adopt modern cloud technologies and best practices.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           true
resume_section_associations:    true
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            ""
  resume_twitter_url:           ""
  resume_dribbble_url:          ""
  resume_facebook_url:          ""
  resume_linkedin_url:          ""
  resume_instagram_url:         ""
  resume_website_url:           ""
  resume_medium_url:            ""
resume_print_social_links:      false

# Design settings
resume_theme:                   default
